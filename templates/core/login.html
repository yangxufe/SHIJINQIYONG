{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 食尽其用</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main class="page">
    <h1>登录</h1>
    {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
    {% if form.errors %}<p class="error" role="alert">账号或密码错误，请重试。</p>{% endif %}
    <form method="post" action="{% url 'login' %}" class="login-form">
      {% csrf_token %}
      <label for="id_username">成员账号</label>
      <input id="id_username" name="username" type="text" autocomplete="username" maxlength="150" required autofocus>
      <label for="id_password">密码</label>
      <div class="password-control">
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
        {% include 'core/password_peek.html' with input_id='id_password' %}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">登录</button>
    </form>
    <p><a href="{% url 'register' %}">注册新账号</a> / <a href="{% url 'welcome' %}">返回首页</a></p>
  </main>
<script type="module" src="{% static 'js/password-peek.js' %}"></script>
</body>
</html>
