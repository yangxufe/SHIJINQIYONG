{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今天先吃 · 食尽其用</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<main class="page app-page" id="today-page">
  <header class="app-header">
    <div class="today-header-actions">
      {% if request.user.member_role.role == "admin" %}<a href="{% url 'household_settings' %}">家庭设置</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="text-button">退出登录</button></form>
    </div>
    <h1>今天先吃</h1>
    <p class="small-note">计划日期是安排提醒，不是安全期限。</p>
  </header>
  {% for message in messages %}<p class="notice" role="status">{{ message }}</p>{% endfor %}
</main>
{% include 'core/nav.html' with active_tab='today' %}
</body>
</html>
